name: Test

on:
  push:
    branches: [main, develop]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go-version: ['1.24.x', '1.25.x', 'stable']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}
      - run: go vet ./...
      - run: go build ./...
      # Zero-dependency module; this guard keeps it that way.
      - run: go mod tidy && git diff --exit-code
      - run: gofmt -s -l . | tee /tmp/unformatted && test ! -s /tmp/unformatted
      - run: go test -race -shuffle=on -count=1 -covermode=atomic -coverprofile=coverage.txt ./...
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.go-version }}
          path: coverage.txt
