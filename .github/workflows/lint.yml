name: Lint

on:
  push:
    branches: [main, develop]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # .golangci.yml targets the golangci-lint v2 config schema.
      - uses: golangci/golangci-lint-action@v9
        with:
          args: --timeout 5m
